<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MouFlip</title>
<link rel="icon" type="image/svg+xml" href="/icons/mouflip.svg"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/icons/manifest.webmanifest"><meta name="theme-color" content="#121315">
<link rel="stylesheet" href="/ui/mou-ui.css?v={{ version|urlencode }}">
<script src="/ui/mou-ui.js?v={{ version|urlencode }}" defer></script>
<link rel="stylesheet" href="/ui/apparence.css?v={{ version|urlencode }}">
<script src="/ui/apparence.js?v={{ version|urlencode }}" defer></script>
<style>
    body { padding:16px; }
    .container { max-width:960px; margin:0 auto; }
    button, select, input[type=text] { font:inherit; }
    .btn { padding:9px 16px; border:0; border-radius:4px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    .btn:hover { background:var(--accent-hover); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.ghost { background:var(--field); color:var(--text); font-weight:500; }
    .btn.small { padding:6px 12px; font-size:.85rem; }
    .panel { background:var(--card); border-radius:8px; padding:16px; margin-bottom:14px; }
    .search-row { display:flex; gap:8px; }
    .search-row input { flex:1; min-width:0; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:10px; outline:none; }
    .search-row input:focus { border-color:var(--accent); }
    .cand { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; cursor:pointer; border:1px solid var(--line); margin-top:8px; }
    .cand:hover { background:var(--field); }
    .cand b { flex:1; min-width:0; } .cand small { color:var(--muted); }
    .muted { color:var(--muted); font-size:.85rem; }
    .pill { font-size:.72rem; padding:2px 8px; border-radius:10px; background:var(--field); color:var(--muted); white-space:nowrap; }
    .pill.ok { background:rgba(82,181,75,.18); color:#9bdc95; }
    .pill.warn { background:rgba(230,170,50,.18); color:#e6c068; }
    .pill.err { background:rgba(220,80,80,.18); color:#e89090; }
    .fiche { display:flex; gap:14px; align-items:flex-start; }
    .fiche img { width:96px; height:96px; object-fit:cover; border-radius:8px; background:var(--field); flex:none; }
    .fiche h2 { margin:0 0 4px; font-size:1.25rem; }
    .bio { font-size:.85rem; color:var(--muted); margin-top:8px; max-height:4.6em; overflow:hidden; }
    .bio.ouverte { max-height:none; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
    .toolbar select { background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px; }
    .clip { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; padding:10px 4px; border-top:1px solid var(--line); }
    .clip input[type=checkbox] { width:20px; height:20px; margin-top:2px; }
    .clip .t { font-weight:600; word-break:break-word; }
    .clip .chemin { grid-column:2; font-size:.74rem; color:var(--muted); word-break:break-all; }
    .clip .fmt { grid-column:2; font-size:.85rem; }
    .voir { grid-column:1 / -1; margin-top:6px; }
    .lecteur { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; cursor:pointer; }
    .lecteur img { width:100%; height:100%; object-fit:cover; opacity:.85; }
    .lecteur .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:3rem; color:#fff; text-shadow:0 2px 8px #000; }
    .lecteur iframe { width:100%; height:100%; border:0; }
    .alt { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
    .alt button { text-align:left; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:.8rem; cursor:pointer; max-width:100%; }
    .alt button.cur { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--field)); }

    /* ===== la fiche (ce qui sera visible dans Emby) ===== */
    #fiche { position:fixed; inset:0; z-index:100; background:var(--bg, #121315); overflow-y:auto; display:none; -webkit-overflow-scrolling:touch; }
    #fiche.ouvert { display:block; }
    .fi-hero { position:relative; min-height:210px; background-size:cover; background-position:center; background-color:#1b1d20; }
    .fi-hero::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(18,19,21,.30), rgba(18,19,21,.55) 60%, var(--bg, #121315)); }
    .fi-hero > * { position:relative; z-index:1; }
    .fi-haut { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; }
    .fi-haut .btn { background:rgba(0,0,0,.55); }
    .fi-entete { display:flex; gap:14px; align-items:flex-end; padding:8px 14px 14px; max-width:900px; margin:0 auto; }
    .fi-entete .affiche { width:42%; max-width:300px; aspect-ratio:16/9; border-radius:8px; background:#000 center/cover; box-shadow:0 6px 20px rgba(0,0,0,.6); flex:none; }
    .fi-entete .titres { min-width:0; }
    .fi-entete .logo { max-height:54px; max-width:100%; display:block; margin-bottom:8px; }
    .fi-entete h2 { margin:0; font-size:1.3rem; line-height:1.2; word-break:break-word; }
    .fi-entete .sous { color:var(--muted); font-size:.85rem; margin-top:4px; }
    .fi-corps { max-width:900px; margin:0 auto; padding:0 14px 120px; }
    section.fi { background:var(--card); border-radius:10px; padding:14px; margin:12px 0; }
    section.fi h3 { margin:0 0 4px; font-size:1.02rem; }
    section.fi .aide { color:var(--muted); font-size:.8rem; margin-bottom:8px; }
    .fi-infos { display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:.88rem; margin:8px 0; }
    .fi-infos dt { color:var(--muted); } .fi-infos dd { margin:0; word-break:break-word; }
    .bande { display:flex; gap:8px; overflow-x:auto; padding:6px 2px 10px; scroll-snap-type:x proximity; }
    .vign { flex:none; scroll-snap-align:start; width:160px; border:2px solid transparent; border-radius:8px; background:var(--field); padding:0; cursor:pointer; position:relative; overflow:hidden; color:var(--text); text-align:left; }
    .vign img { width:100%; height:90px; object-fit:cover; display:block; background:#000; }
    .vign.logo img { object-fit:contain; background:repeating-conic-gradient(#2c2c2c 0% 25%, #1d1d1d 0% 50%) 50% / 16px 16px; }
    .vign.banniere { width:260px; } .vign.banniere img { height:48px; object-fit:contain; background:#000; }
    .vign.fond { width:190px; } .vign.fond img { height:107px; }
    .vign.carre { width:112px; } .vign.carre img { height:112px; }
    .vign small { display:block; font-size:.68rem; color:var(--muted); padding:4px 6px; }
    .vign .coche { position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; font-size:.8rem; display:none; align-items:center; justify-content:center; }
    .vign.sel { border-color:var(--accent); } .vign.sel .coche { display:flex; }
    .vign.aucune { width:90px; display:flex; align-items:center; justify-content:center; min-height:120px; font-size:.8rem; text-align:center; padding:6px; }
    .vign.actuelle small { color:#9bdc95; }
    .vign.fixe { cursor:default; opacity:.9; }
    .fi-bio { width:100%; min-height:150px; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:10px; font:inherit; font-size:.9rem; line-height:1.45; resize:vertical; }
    .fi-nfo { background:#0d0e10; border-radius:6px; padding:10px; font:12px/1.4 ui-monospace,Menlo,monospace; color:#b9c0c8; white-space:pre-wrap; word-break:break-all; max-height:260px; overflow:auto; }
    .fi-plan { list-style:none; margin:6px 0 0; padding:0; font-size:.8rem; }
    .fi-plan li { padding:4px 0; border-top:1px solid var(--line); word-break:break-all; color:var(--muted); }
    .fi-plan li b { color:var(--text); font-weight:600; }
    .fi-barre { position:fixed; left:0; right:0; bottom:0; z-index:110; background:var(--card); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; box-shadow:0 -4px 18px rgba(0,0,0,.45); }
    .fi-barre .resume { flex:1; min-width:0; font-size:.78rem; color:var(--muted); }
    .fi-barre .btn { padding:11px 14px; }
    @media (max-width:560px) { .fi-barre { flex-wrap:wrap; } .fi-barre .resume { flex:1 1 100%; } .fi-barre .btn { flex:1; } }
    @media (max-width:560px) { .fi-entete { flex-direction:column; align-items:flex-start; } .fi-entete .affiche { width:100%; max-width:none; } }

    /* cases d'images : fond sombre IMPOSÉ (les styles de boutons du thème ne doivent pas les colorer) et légendes lisibles */
    #fiche button.vign { background:#1b1d20 !important; color:#eceff3 !important; border:2px solid #3a3f45 !important; box-shadow:none !important; font-weight:400 !important; }
    #fiche button.vign:hover { border-color:#6b737c !important; }
    #fiche button.vign.sel { border-color:var(--accent) !important; background:#1d2a1f !important; }
    #fiche button.vign.fixe { opacity:.8; }
    #fiche button.vign small { display:block; padding:7px 8px 8px; font-size:.8rem; line-height:1.35; color:#eceff3 !important; background:transparent !important; }
    #fiche .vign .src { display:inline-block; padding:1px 8px; border-radius:10px; font-weight:700; font-size:.74rem; background:#27384d; color:#d3e6ff; }
    #fiche .vign .src.audiodb { background:#3d2b4f; color:#efdcff; }
    #fiche .vign .src.video { background:#2f3f2c; color:#d9f2d4; }
    #fiche .vign .actu { color:#a6e49f; font-weight:700; }
    #fiche .vign .remp { color:#f4c76e; font-weight:600; }
    #fiche .vign .dim { display:block; color:#aeb5bd; font-size:.72rem; margin-top:2px; }
    #fiche button.vign.aucune { color:#eceff3 !important; font-weight:600 !important; }
    #fiche .vign .coche { background:var(--accent); }
    /* barre des téléchargements : toujours visible en bas, la page reste défilable derrière ; un toucher déplie la liste */
    #travaux { position:fixed; left:0; right:0; bottom:0; z-index:50; margin:0; padding:0; border-radius:12px 12px 0 0; box-shadow:0 -4px 18px rgba(0,0,0,.45); max-width:960px; margin-left:auto; margin-right:auto; }
    #travaux[hidden] { display:none; }
    #travaux .entete { display:flex; align-items:center; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); cursor:pointer; user-select:none; }
    #travaux .entete .resume { flex:1; min-width:0; font-size:.88rem; }
    #travaux .entete .resume b { color:var(--text); }
    #travaux .entete .mini { height:5px; background:var(--field); border-radius:3px; margin-top:5px; overflow:hidden; }
    #travaux .entete .mini i { display:block; height:100%; background:var(--accent); transition:width .4s; }
    #travaux .fleche { font-size:1.1rem; color:var(--muted); transition:transform .2s; }
    #travaux.ouvert .fleche { transform:rotate(180deg); }
    #travaux .corps { display:none; max-height:55vh; overflow-y:auto; padding:0 14px 12px; border-top:1px solid var(--line); }
    #travaux.ouvert .corps { display:block; }
    .job { border-top:1px solid var(--line); padding:10px 0; }
    label.qual { display:flex; gap:10px; align-items:flex-start; padding:7px 4px; border-top:1px solid var(--line); cursor:pointer; font-size:.88rem; }
    label.qual input { width:20px; height:20px; margin-top:2px; flex:none; }
    .job .titre { font-weight:600; word-break:break-word; }
    .job .barre { height:6px; background:var(--field); border-radius:3px; margin:6px 0; overflow:hidden; }
    .job .barre i { display:block; height:100%; background:var(--accent); }
    .job ul { margin:6px 0 6px 18px; padding:0; font-size:.78rem; color:var(--muted); word-break:break-all; }
    .job .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    details.ajout { margin:10px 0; padding:10px 12px; border:1px dashed var(--line); border-radius:8px; }
    details.ajout summary { cursor:pointer; font-weight:600; }
    .ajout .champ { display:block; margin:8px 0; } .ajout .champ input { width:100%; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:9px; }
    label.red { font-size:.82rem; color:var(--muted); display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
    label.red select { background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px; max-width:100%; }
    /* barre collée en haut de l'écran pendant qu'on fait défiler la liste des clips : plus besoin de remonter pour lancer le téléchargement */
    .barre-clips { position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); padding:10px 0; margin:8px 0 4px; border-bottom:1px solid var(--line); box-shadow:0 6px 10px -8px rgba(0,0,0,.6); }
    .barre-clips .resume { flex:1 1 100%; font-size:.88rem; color:var(--muted); } .barre-clips .resume b { color:var(--text); }
    .barre-clips .btn#telecharger { flex:1; padding:11px 14px; }
    @media (min-width:600px) { .barre-clips .resume { flex:1 1 auto; } .barre-clips .btn#telecharger { flex:none; } }
    .chaine { margin:4px 0; font-size:.9rem; word-break:break-word; }
    .clip.nouveau { animation: nouveau 4s ease-out; border-radius:8px; }
    @keyframes nouveau { 0%, 60% { background:rgba(82,181,75,.28); } 100% { background:transparent; } }
    .recherche { display:flex; gap:6px; margin:6px 0 8px; }
    .recherche input { flex:1; min-width:0; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:10px; font:inherit; outline:none; }
    .recherche input:focus { border-color:var(--accent); }
    .clip.masque { display:none; }
    .progress { background:var(--field); border-radius:6px; height:30px; position:relative; overflow:hidden; display:none; margin:8px 0; }
    .progress.show { display:block; }
    .progress .bar { background:var(--accent); height:100%; width:0; transition:width .4s; }
    .progress .txt { position:absolute; inset:0; display:flex; align-items:center; padding:0 12px; font-size:.85rem; }
    .note { padding:8px 12px; border-radius:6px; margin-top:8px; font-size:.88rem; background:var(--field); }
    .note.err { background:rgba(220,80,80,.18); } .note.warn { background:rgba(230,170,50,.18); }
    @media (max-width:600px) { body { padding:10px; } .search-row { flex-direction:column; } .search-row .btn { padding:12px; } input[type=text], select { font-size:16px; } .toolbar .btn { flex:1 1 45%; padding:11px; } }
</style>
</head>
<body>
<div class="container">
    <div id="mou-header" data-app="mouflip" data-prefix="MouFl" data-rest="ip" data-version="{{ version }}" data-settings="1" data-sub="Clips vidéo K-pop pour Emby (lecture seule pour l'instant : rien n'est téléchargé ni rangé)"></div>

    <div class="panel">
        <div class="search-row"><input type="text" id="q" placeholder="Nom du groupe (ex. BLACKPINK, aespa…)" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="chercher">🔎 Chercher</button></div>
        <div id="cands"></div>
        <div id="msg"></div>
    </div>

    <div id="groupe" hidden></div>

    <div id="fiche" role="dialog" aria-modal="true" aria-label="Fiche du clip">
        <div id="ficheCorps"></div>
        <div class="fi-barre"><div class="resume" id="ficheResume"></div><button class="btn ghost" id="ficheFermer">Fermer</button><button class="btn" id="ficheRanger">📁 Ranger dans Video clip</button></div>
    </div>

    <div class="panel" id="travaux" hidden>
        <div class="entete" id="travauxEntete" role="button" tabindex="0" aria-label="Téléchargements et rangement : afficher ou masquer la liste">
            <span>⬇️</span><div class="resume" id="travauxResume"></div><span class="fleche">▲</span>
        </div>
        <div class="corps">
            <div class="muted" style="padding-top:8px">Le clip est d'abord préparé sur le serveur (meilleure qualité, volume réglé). Il n'entre dans « Video clip » que quand tu touches « Ranger ».</div>
            <div id="travauxListe"></div>
        </div>
    </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url, opts) {
    const r = await fetch(url, opts); let d = {};
    try { d = await r.json(); } catch (e) { d = {error: 'Réponse illisible du serveur (code ' + r.status + ').'}; }
    if (!r.ok && !d.error) d.error = 'Erreur ' + r.status;
    return d;
}
const post = (url, body) => api(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
function note(text, kind) { $('msg').innerHTML = text ? `<div class="note ${kind || ''}">${esc(text)}</div>` : ''; }

let G = null, F = {}, V = {}, AP = {}, VER = {}, Q = {}, QUAL = {}, RD = {}, REDGEN = {actif: false, crf: 30};   // Q : qualité choisie par clip ; QUAL : qualités lues par vidéo   // groupe affiché, formats lus (titre -> résultat), vidéo choisie (titre -> id), aperçus (titre -> candidats)

async function chercher() {
    const q = $('q').value.trim(); if (q.length < 2) return;
    $('cands').innerHTML = ''; note('Recherche…');
    const d = await api('/api/groupes/chercher?q=' + encodeURIComponent(q));
    if (d.error) return note(d.error, 'err');
    note('');
    if (!(d.groupes || []).length) return note('Aucun groupe trouvé pour « ' + q + ' ».', 'warn');
    $('cands').innerHTML = d.groupes.map(g => `<div class="cand" data-id="${esc(g.mbid)}"><b>${esc(g.nom)} <small>${esc([g.type, g.pays, g.debut, g.precision].filter(Boolean).join(' · '))}</small></b><span class="pill">${g.score} %</span></div>`).join('');
    document.querySelectorAll('.cand').forEach(el => el.addEventListener('click', () => ouvrir(el.dataset.id)));
}
async function ouvrir(mbid, actualiser) {
    note(actualiser ? 'Mise à jour de la liste auprès de MusicBrainz (jusqu’à une minute)…' : 'Lecture de la fiche et de la liste des clips…');
    $('groupe').hidden = true;
    const d = await api('/api/groupe/' + mbid + (actualiser ? '?actualiser=1' : ''));
    if (d.error) return note(d.error, 'err');
    note(''); $('cands').innerHTML = ''; G = d; F = {}; AP = {};
    const ch = await api('/api/choix/' + mbid); V = ch.choix || {};
    const cq = await api('/api/choix_qualite/' + mbid); Q = cq.choix || {};
    const cr = await api('/api/choix_reduction/' + mbid); RD = cr.choix || {}; REDGEN = await api('/api/settings/reduction');
    dessiner();
}
function filtreClips() {
    const t = $('fTypes') ? $('fTypes').value : 'clip', d = $('fDeja') ? $('fDeja').value : 'tous';
    return G.clips.filter(c => (t === 'tous' || c.type === t) && (d === 'tous' || (d === 'manquants' ? !c.deja : c.deja)));
}
function formatTxt(r) {
    if (!r) return '';
    if (r.etat === 'erreur') return `<span class="pill err">⚠️ ${esc(r.erreur)}</span>`;
    if (r.etat === 'introuvable') return `<span class="pill warn">Vidéo officielle introuvable sur YouTube</span>`;
    const f = r.format, v = r.video;
    if (!f) return `<span class="pill warn">Aucun format vidéo lisible</span>`;
    return `<span class="pill ok">${esc(f.resolution)} · ${esc(f.codec)} · ${f.debit_kbps} kb/s${f.fps ? ' · ' + f.fps + ' i/s' : ''}${f.premium ? ' · ⭐ Premium' : ''}</span> <span class="muted">${esc(v.chaine || '')} · « ${esc(v.titre)} »</span>`;
}
function dessiner() {
    const f = G.fiche, img = G.images.vignette || '';
    const liste = filtreClips();
    $('groupe').hidden = false;
    $('groupe').innerHTML = `
    <div class="panel">
        <div class="fiche">${img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">` : ''}
            <div style="min-width:0"><h2>${esc(f.nom)}</h2>
            <div class="muted">${esc([f.type, f.pays, f.debut ? 'depuis ' + f.debut : '', (f.genres || []).slice(0, 3).join(', ')].filter(Boolean).join(' · '))}</div>
            <div class="muted" style="margin-top:6px">${G.dossier_groupe ? `📁 Dossier existant : <b>${esc(G.dossier_groupe)}</b> (${G.nb_locaux} vidéo(s))` : `📁 Pas encore de dossier : <b>${esc(G.racine)}/${esc(f.nom)}</b> serait créé (rien ne l'est maintenant)`}</div>
            ${G.racine_ok ? '' : `<div class="note err">Le dossier des clips « ${esc(G.racine)} » est introuvable : le partage est-il monté ? (⚙️ Réglages → Dossiers)</div>`}
            </div></div>
        ${G.biographie ? `<div class="bio" id="bio">${esc(G.biographie)}</div><a href="#" id="bioPlus" class="muted">Lire la suite</a>` : ''}
        ${(G.erreurs || []).map(e => `<div class="note warn">⚠️ ${esc(e)}</div>`).join('')}
        <details class="ajout" id="chainesBloc"><summary>📺 Sources officielles : chaînes et playlists YouTube (${(G.chaines || []).length})</summary>

async function lireFormats() {

        $('progBar').style.width = (100 * e.fait / e.total) + '%'; $('progTxt').textContent = `Lecture des formats… ${e.fait} / ${e.total}`;

async function telechargerCoches() {

function bandeImages(typeCss, bloc, cle) {

}
function fermerFiche() { $('fiche').classList.remove('ouvert'); document.body.style.overflow = ''; FI = null; suivreTravaux(); }
$('ficheFermer').onclick = fermerFiche;
$('ficheRanger').onclick = async () => { if (!FI) return; const id = FI.id, nom = FI.clip.titre; if (await rangerClip(id, nom)) fermerFiche(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('fiche').classList.contains('ouvert')) fermerFiche(); });

function resumeTravaux(liste) {
    const actifs = liste.filter(t => ['attente', 'telechargement', 'reduction', 'audio'].includes(t.etat)), prets = liste.filter(t => t.etat === 'pret'),
          erreurs = liste.filter(t => t.etat === 'erreur'), ranges = liste.filter(t => t.etat === 'range');
    const enCours = actifs.find(t => t.etat !== 'attente') || actifs[0];
    const morceaux = [];
    if (actifs.length) morceaux.push(`<b>${actifs.length} en cours</b>`);
    if (prets.length) morceaux.push(`<b>${prets.length} prêt${prets.length > 1 ? 's' : ''} à ranger</b>`);
    if (erreurs.length) morceaux.push(`${erreurs.length} en erreur`);
    if (ranges.length) morceaux.push(`${ranges.length} rangé${ranges.length > 1 ? 's' : ''}`);
    $('travauxResume').innerHTML = morceaux.join(' · ') + (enCours ? `<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(enCours.titre)} : ${esc(enCours.message || '')}</div><div class="mini"><i style="width:${enCours.progres || 0}%"></i></div>` : '');
    ajusterBas();
}
function ajusterBas() {                                                // la page garde de la place sous le contenu : rien n'est caché par la barre
    document.body.style.paddingBottom = $('travaux').hidden ? '' : ($('travaux').offsetHeight + 16) + 'px';
}
function ouvrirTravaux(ouvert) {
    $('travaux').classList.toggle('ouvert', ouvert);
    try { localStorage.setItem('mouflipTravauxOuvert', ouvert ? '1' : '0'); } catch (e) {}
    ajusterBas();
}
$('travauxEntete').addEventListener('click', () => ouvrirTravaux(!$('travaux').classList.contains('ouvert')));
$('travauxEntete').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrirTravaux(!$('travaux').classList.contains('ouvert')); } });
try { if (localStorage.getItem('mouflipTravauxOuvert') === '1') $('travaux').classList.add('ouvert'); } catch (e) {}
window.addEventListener('resize', ajusterBas);
function carteTravail(t) {
    const actif = ['attente', 'telechargement', 'reduction', 'audio'].includes(t.etat);
    const pill = {attente: '<span class="pill">en attente</span>', telechargement: '<span class="pill warn">téléchargement</span>', reduction: '<span class="pill warn">réduction de la taille</span>', audio: '<span class="pill warn">volume</span>',
                  pret: '<span class="pill ok">prêt à ranger</span>', range: '<span class="pill ok">✅ rangé</span>', erreur: '<span class="pill err">erreur</span>'}[t.etat] || '';
    return `<div class="job"><div class="titre">${esc(t.groupe)} · ${esc(t.titre)} <span class="muted">${esc(t.album)}</span> ${pill}${t.qualite ? ' <span class="pill">' + esc(t.qualite) + '</span>' : ''}${t.reduction_mode && t.reduction_mode !== 'defaut' ? ' <span class="pill">📉 ' + esc(NOMS_RED[t.reduction_mode] || '') + '</span>' : ''}</div>
        ${actif ? `<div class="barre"><i style="width:${t.progres || 0}%"></i></div>` : ''}
        <div class="muted">${esc(t.message || '')}</div>
        
        <div class="acts">
        ${t.etat === 'pret' ? `<button class="btn small" data-fiche="${t.id}">🧾 Ouvrir la fiche (images, textes, infos)</button><button class="btn small ghost" data-ranger="${t.id}" data-nom="${esc(t.titre)}">📁 Ranger tout de suite</button>` : ''}
        ${t.etat === 'erreur' ? `<button class="btn small" data-relancer="${t.id}">↻ Relancer</button>` : ''}
        ${actif ? '' : `<button class="btn small ghost" data-retirer="${t.id}">Retirer de la liste</button>`}</div></div>`;
}
async function rangerClip(id, nom) {
    if (!await MouConfirm(`Ranger « ${nom} » dans « Video clip » ?\n\nLe clip, son .nfo, son poster et les images choisies seront créés. Les fichiers déjà là sont conservés (sauf une image que tu as choisi de remplacer : l'ancienne est sauvegardée).`, {ok: 'Ranger', annuler: 'Pas maintenant'})) return false;
    note('Rangement…');
    const r = await post('/api/travaux/' + id + '/ranger');
    note(r.ok ? 'Rangé. ' + (r.emby || '') : (r.error || 'Rangement impossible.'), r.ok ? '' : 'err');
    suivreTravaux();
    return !!r.ok;
}
async function ranger(id, nom) { return rangerClip(id, nom); }
$('chercher').addEventListener('click', chercher);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') chercher(); });
suivreTravaux();
</script>
</body>
</html>
