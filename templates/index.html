<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MouFlip</title>
<link rel="icon" type="image/svg+xml" href="/icons/mouflip.svg"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/icons/manifest.webmanifest"><meta name="theme-color" content="#121315">
<link rel="stylesheet" href="/ui/mou-ui.css?v={{ version|urlencode }}">
<script src="/ui/mou-ui.js?v={{ version|urlencode }}" defer></script>
<link rel="stylesheet" href="/ui/apparence.css?v={{ version|urlencode }}">
<script src="/ui/apparence.js?v={{ version|urlencode }}" defer></script>
<style>
    body { padding:16px; }
    .container { max-width:960px; margin:0 auto; }
    button, select, input[type=text] { font:inherit; }
    .btn { padding:9px 16px; border:0; border-radius:4px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    .btn:hover { background:var(--accent-hover); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.ghost { background:var(--field); color:var(--text); font-weight:500; }
    .btn.small { padding:6px 12px; font-size:.85rem; }
    .panel { background:var(--card); border-radius:8px; padding:16px; margin-bottom:14px; }
    .search-row { display:flex; gap:8px; }
    .search-row input { flex:1; min-width:0; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:10px; outline:none; }
    .search-row input:focus { border-color:var(--accent); }
    .cand { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; cursor:pointer; border:1px solid var(--line); margin-top:8px; }
    .cand:hover { background:var(--field); }
    .cand b { flex:1; min-width:0; } .cand small { color:var(--muted); }
    .muted { color:var(--muted); font-size:.85rem; }
    .pill { font-size:.72rem; padding:2px 8px; border-radius:10px; background:var(--field); color:var(--muted); white-space:nowrap; }
    .pill.ok { background:rgba(82,181,75,.18); color:#9bdc95; }
    .pill.warn { background:rgba(230,170,50,.18); color:#e6c068; }
    .pill.err { background:rgba(220,80,80,.18); color:#e89090; }
    .fiche { display:flex; gap:14px; align-items:flex-start; }
    .fiche img { width:96px; height:96px; object-fit:cover; border-radius:8px; background:var(--field); flex:none; }
    .fiche h2 { margin:0 0 4px; font-size:1.25rem; }
    .bio { font-size:.85rem; color:var(--muted); margin-top:8px; max-height:4.6em; overflow:hidden; }
    .bio.ouverte { max-height:none; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
    .toolbar select { background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px; }
    .clip { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; padding:10px 4px; border-top:1px solid var(--line); }
    .clip input[type=checkbox] { width:20px; height:20px; margin-top:2px; }
    .clip .t { font-weight:600; word-break:break-word; }
    .clip .chemin { grid-column:2; font-size:.74rem; color:var(--muted); word-break:break-all; }
    .clip .fmt { grid-column:2; font-size:.85rem; }
    .voir { grid-column:1 / -1; margin-top:6px; }
    .lecteur { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; cursor:pointer; }
    .lecteur img { width:100%; height:100%; object-fit:cover; opacity:.85; }
    .lecteur .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:3rem; color:#fff; text-shadow:0 2px 8px #000; }
    .lecteur iframe { width:100%; height:100%; border:0; }
    .alt { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
    .alt button { text-align:left; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:.8rem; cursor:pointer; max-width:100%; }
    .alt button.cur { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--field)); }
    .job { border-top:1px solid var(--line); padding:10px 0; }
    .job .titre { font-weight:600; word-break:break-word; }
    .job .barre { height:6px; background:var(--field); border-radius:3px; margin:6px 0; overflow:hidden; }
    .job .barre i { display:block; height:100%; background:var(--accent); }
    .job ul { margin:6px 0 6px 18px; padding:0; font-size:.78rem; color:var(--muted); word-break:break-all; }
    .job .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .progress { background:var(--field); border-radius:6px; height:30px; position:relative; overflow:hidden; display:none; margin:8px 0; }
    .progress.show { display:block; }
    .progress .bar { background:var(--accent); height:100%; width:0; transition:width .4s; }
    .progress .txt { position:absolute; inset:0; display:flex; align-items:center; padding:0 12px; font-size:.85rem; }
    .note { padding:8px 12px; border-radius:6px; margin-top:8px; font-size:.88rem; background:var(--field); }
    .note.err { background:rgba(220,80,80,.18); } .note.warn { background:rgba(230,170,50,.18); }
    @media (max-width:600px) { body { padding:10px; } .search-row { flex-direction:column; } .search-row .btn { padding:12px; } input[type=text], select { font-size:16px; } .toolbar .btn { flex:1 1 45%; padding:11px; } }
</style>
</head>
<body>
<div class="container">
    <div id="mou-header" data-app="mouflip" data-prefix="MouFl" data-rest="ip" data-version="{{ version }}" data-settings="1" data-sub="Clips vidéo K-pop pour Emby (lecture seule pour l'instant : rien n'est téléchargé ni rangé)"></div>

    <div class="panel">
        <div class="search-row"><input type="text" id="q" placeholder="Nom du groupe (ex. BLACKPINK, aespa…)" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="chercher">🔎 Chercher</button></div>
        <div id="cands"></div>
        <div id="msg"></div>
    </div>

    <div id="groupe" hidden></div>

    <div class="panel" id="travaux" hidden>
        <h3 style="margin:0 0 4px">Téléchargements et rangement</h3>
        <div class="muted">Le clip est d'abord préparé sur le serveur (meilleure qualité, volume réglé). Il n'entre dans « Video clip » que quand tu touches « Ranger ».</div>
        <div id="travauxListe"></div>
    </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url, opts) {
    const r = await fetch(url, opts); let d = {};
    try { d = await r.json(); } catch (e) { d = {error: 'Réponse illisible du serveur (code ' + r.status + ').'}; }
    if (!r.ok && !d.error) d.error = 'Erreur ' + r.status;
    return d;
}
const post = (url, body) => api(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
function note(text, kind) { $('msg').innerHTML = text ? `<div class="note ${kind || ''}">${esc(text)}</div>` : ''; }

let G = null, F = {}, V = {}, AP = {}, VER = {};   // groupe affiché, formats lus (titre -> résultat), vidéo choisie (titre -> id), aperçus (titre -> candidats)

async function chercher() {
    const q = $('q').value.trim(); if (q.length < 2) return;
    $('cands').innerHTML = ''; note('Recherche…');
    const d = await api('/api/groupes/chercher?q=' + encodeURIComponent(q));
    if (d.error) return note(d.error, 'err');
    note('');
    if (!(d.groupes || []).length) return note('Aucun groupe trouvé pour « ' + q + ' ».', 'warn');
    $('cands').innerHTML = d.groupes.map(g => `<div class="cand" data-id="${esc(g.mbid)}"><b>${esc(g.nom)} <small>${esc([g.type, g.pays, g.debut, g.precision].filter(Boolean).join(' · '))}</small></b><span class="pill">${g.score} %</span></div>`).join('');
    document.querySelectorAll('.cand').forEach(el => el.addEventListener('click', () => ouvrir(el.dataset.id)));
}
async function ouvrir(mbid, actualiser) {
    note(actualiser ? 'Mise à jour de la liste auprès de MusicBrainz (jusqu’à une minute)…' : 'Lecture de la fiche et de la liste des clips…');
    $('groupe').hidden = true;
    const d = await api('/api/groupe/' + mbid + (actualiser ? '?actualiser=1' : ''));
    if (d.error) return note(d.error, 'err');
    note(''); $('cands').innerHTML = ''; G = d; F = {}; AP = {};
    const ch = await api('/api/choix/' + mbid); V = ch.choix || {};
    dessiner();
}
function filtreClips() {
    const t = $('fTypes') ? $('fTypes').value : 'clip', d = $('fDeja') ? $('fDeja').value : 'tous';
    return G.clips.filter(c => (t === 'tous' || c.type === t) && (d === 'tous' || (d === 'manquants' ? !c.deja : c.deja)));
}
function formatTxt(r) {
    if (!r) return '';
    if (r.etat === 'erreur') return `<span class="pill err">⚠️ ${esc(r.erreur)}</span>`;
    if (r.etat === 'introuvable') return `<span class="pill warn">Vidéo officielle introuvable sur YouTube</span>`;
    const f = r.format, v = r.video;
    if (!f) return `<span class="pill warn">Aucun format vidéo lisible</span>`;
    return `<span class="pill ok">${esc(f.resolution)} · ${esc(f.codec)} · ${f.debit_kbps} kb/s${f.fps ? ' · ' + f.fps + ' i/s' : ''}${f.premium ? ' · ⭐ Premium' : ''}</span> <span class="muted">${esc(v.chaine || '')} · « ${esc(v.titre)} »</span>`;
}
function dessiner() {
    const f = G.fiche, img = G.images.vignette || '';
    const liste = filtreClips();
    $('groupe').hidden = false;
    $('groupe').innerHTML = `
    <div class="panel">
        <div class="fiche">${img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">` : ''}
            <div style="min-width:0"><h2>${esc(f.nom)}</h2>
            <div class="muted">${esc([f.type, f.pays, f.debut ? 'depuis ' + f.debut : '', (f.genres || []).slice(0, 3).join(', ')].filter(Boolean).join(' · '))}</div>
            <div class="muted" style="margin-top:6px">${G.dossier_groupe ? `📁 Dossier existant : <b>${esc(G.dossier_groupe)}</b> (${G.nb_locaux} vidéo(s))` : `📁 Pas encore de dossier : <b>${esc(G.racine)}/${esc(f.nom)}</b> serait créé (rien ne l'est maintenant)`}</div>
            ${G.racine_ok ? '' : `<div class="note err">Le dossier des clips « ${esc(G.racine)} » est introuvable : le partage est-il monté ? (⚙️ Réglages → Dossiers)</div>`}
            </div></div>
        ${G.biographie ? `<div class="bio" id="bio">${esc(G.biographie)}</div><a href="#" id="bioPlus" class="muted">Lire la suite</a>` : ''}
        ${(G.erreurs || []).map(e => `<div class="note warn">⚠️ ${esc(e)}</div>`).join('')}
    </div>
    <div class="panel">
        <h3 style="margin:0 0 4px">Clips (${liste.length} affichés sur ${G.clips.length})</h3>
        <div class="muted">${G.enregistre ? '📌 Liste enregistrée le ' + new Date(G.enregistre * 1000).toLocaleDateString('fr-FR') + ' (pas redemandée à chaque fois) · ' : ''}<a href="#" id="actualiser">🔄 Actualiser la liste</a></div>
        <div class="muted">Liste de MusicBrainz : elle peut être incomplète ou contenir des vidéos qui ne sont pas des clips ; ce sera affiné.</div>
        <div class="toolbar">
            <select id="fTypes"><option value="clip">Vrais clips</option><option value="autre">Autres vidéos (concerts, coulisses…)</option><option value="tous">Tout</option></select>
            <select id="fDeja"><option value="tous">Déjà là ou non</option><option value="manquants">Seulement ceux que je n’ai pas</option><option value="deja">Seulement ceux que j’ai</option></select>
            <button class="btn ghost small" id="toutCocher">Tout cocher</button><button class="btn ghost small" id="toutDecocher">Tout décocher</button>
        </div>
        <div class="toolbar"><button class="btn ghost" id="lireFormats">📊 Voir le meilleur format des clips cochés</button><button class="btn" id="telecharger">⬇️ Télécharger les clips cochés</button></div>
        <div class="progress" id="prog"><div class="bar" id="progBar"></div><div class="txt" id="progTxt"></div></div>
        <div id="clips">${liste.map((c, i) => ligne(c, i)).join('') || '<div class="muted" style="padding:14px">Aucun clip dans cette vue.</div>'}</div>
    </div>`;
    $('fTypes').value = dessiner.t || 'clip'; $('fDeja').value = dessiner.d || 'tous';
    $('fTypes').onchange = $('fDeja').onchange = () => { dessiner.t = $('fTypes').value; dessiner.d = $('fDeja').value; dessiner(); };
    $('toutCocher').onclick = () => document.querySelectorAll('.clip input').forEach(x => x.checked = true);
    $('toutDecocher').onclick = () => document.querySelectorAll('.clip input').forEach(x => x.checked = false);
    if ($('actualiser')) $('actualiser').onclick = e => { e.preventDefault(); ouvrir(G.fiche.mbid, true); };
    $('lireFormats').onclick = lireFormats;
    $('telecharger').onclick = telechargerCoches;
    document.querySelectorAll('[data-voir]').forEach(b => b.onclick = () => voir(Number(b.dataset.voir), b));
    if ($('bioPlus')) $('bioPlus').onclick = e => { e.preventDefault(); $('bio').classList.toggle('ouverte'); };
}
function ligne(c, i) {
    return `<div class="clip" data-t="${esc(c.titre)}"><input type="checkbox" ${c.deja ? '' : 'checked'} aria-label="Choisir ce clip">
        <div><span class="t">${esc(c.titre)}</span> <span class="muted">${esc(c.album)}${c.annee ? ' · ' + esc(c.annee) : ''}</span>
        ${c.deja ? '<span class="pill ok">✅ déjà dans la médiathèque</span>' : '<span class="pill">⬇️ à prendre</span>'}
        ${c.source === 'video' ? '<span class="pill" title="MusicBrainz connaît une vidéo pour ce titre">🎞️ vidéo connue</span>' : '<span class="pill warn" title="Single ou titre-phare : la vidéo officielle est à vérifier sur YouTube">à vérifier sur YouTube</span>'}</div>
        <div class="chemin">${c.deja ? '📄 ' + esc(c.fichier_local) : '→ ' + esc(c.chemin_prevu)}</div>
        <div class="fmt" id="fmt${i}">${formatTxt(F[c.titre])}</div>
        <div class="voir"><button class="btn ghost small" data-voir="${i}">👁️ Voir le clip</button>${V[c.titre] ? ' <span class="pill ok">vidéo choisie</span>' : ''}<div id="voir${i}"></div></div></div>`;
}
const taille = o => !o ? '' : o >= 1e9 ? (o / 1e9).toFixed(2).replace('.', ',') + ' Go' : Math.round(o / 1e6) + ' Mo';
function texteVersion(id) {
    const r = VER[id];
    if (!r) return '';
    if (r.etat !== 'ok') return `⚠️ ${esc(r.erreur || 'illisible')}`;
    const f = r.format;
    return `<b>${esc(f.resolution)}</b> ${esc(f.codec)} ${f.debit_kbps} kb/s${f.fps ? ' · ' + Math.round(f.fps) + ' i/s' : ''}${f.premium ? ' · ⭐' : ''} · son ${f.audio_aac ? 'AAC ' + f.audio_aac.debit_kbps + ' kb/s' : '(pas d’AAC)'} · <b>${taille(r.taille)}</b>${r.annee ? ' · ' + esc(r.annee) : ''}`;
}
function majVersions(i, titre) {                                      // met à jour les lignes sans recharger le lecteur
    document.querySelectorAll('#voir' + i + ' .alt button').forEach(b => {
        const x = AP[titre].find(y => y.id === b.dataset.id);
        b.innerHTML = `${esc(x.channel || '')} · ${esc(x.title)} ${x.duration ? '(' + dur(x.duration) + ')' : ''}` + (VER[x.id] ? '<br><span class="muted">' + texteVersion(x.id) + '</span>' : '<br><span class="muted">lecture…</span>');
    });
}
async function lireVersions(i, titre) {
    for (const x of AP[titre]) {
        if (!VER[x.id]) { majVersions(i, titre); VER[x.id] = await post('/api/apercu/version', {video_id: x.id}); }
        majVersions(i, titre);
    }
    const bv = document.querySelector('#voir' + i + ' [data-versions]'); if (bv) bv.textContent = '📊 Formats lus';
}
const dur = s => s ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '';
async function voir(i, bouton) {
    const el = document.querySelectorAll('.clip')[i], titre = el.dataset.t, zone = $('voir' + i);
    if (zone.innerHTML) { zone.innerHTML = ''; return; }                        // 2e appui : on referme
    zone.innerHTML = '<div class="muted" style="margin-top:6px">Recherche des vidéos…</div>';
    if (!AP[titre]) {
        const d = await post('/api/apercu', {groupe: G.fiche.nom, titre});
        if (d.error) { zone.innerHTML = `<div class="note err">${esc(d.error)}</div>`; return; }
        AP[titre] = d.candidats;
    }
    const c = AP[titre];
    if (!c.length) { zone.innerHTML = '<div class="note warn">Aucune vidéo trouvée sur YouTube pour ce titre.</div>'; return; }
    montrer(i, titre, V[titre] || c[0].id);
}
function montrer(i, titre, id) {
    const zone = $('voir' + i), c = AP[titre], cur = c.find(x => x.id === id) || c[0];
    zone.innerHTML = `<div class="lecteur" data-id="${esc(cur.id)}"><img src="https://i.ytimg.com/vi/${esc(cur.id)}/hqdefault.jpg" alt="" referrerpolicy="no-referrer"><div class="play">▶</div></div>
        ${cur.officielle ? '<span class="pill ok">✅ chaîne officielle</span>' : '<span class="pill warn">⚠️ chaîne non reconnue comme officielle : vérifie</span>'}
        <div class="muted" style="margin:6px 0">${esc(cur.channel || '')} · « ${esc(cur.title)} » ${cur.duration ? '· ' + dur(cur.duration) : ''} · <a href="${esc(cur.url)}" target="_blank" rel="noopener">Ouvrir sur YouTube</a></div>
        <div class="muted" style="margin-top:6px">${c.length > 1 ? 'Versions possibles' : 'Version trouvée'} :</div>
        <div class="alt">${c.map(x => `<button data-id="${esc(x.id)}" class="${x.id === cur.id ? 'cur' : ''}">${esc(x.channel || '')} · ${esc(x.title)} ${x.duration ? '(' + dur(x.duration) + ')' : ''}${VER[x.id] ? '<br><span class="muted">' + texteVersion(x.id) + '</span>' : ''}</button>`).join('')}</div>
        <button class="btn small ghost" data-versions="1">📊 Format et taille de chaque version</button>
        <button class="btn small" data-choisir="1">${V[titre] === cur.id ? '✅ Vidéo choisie' : '✅ C’est cette vidéo'}</button>`;
    zone.querySelector('.lecteur').onclick = e => { e.currentTarget.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(cur.id)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`; e.currentTarget.onclick = null; };
    zone.querySelectorAll('.alt button').forEach(b => b.onclick = () => montrer(i, titre, b.dataset.id));
    const bv = zone.querySelector('[data-versions]'); if (bv) bv.onclick = () => { bv.disabled = true; bv.textContent = 'Lecture des formats…'; lireVersions(i, titre); };
    zone.querySelector('[data-choisir]').onclick = () => { V[titre] = cur.id; post('/api/choix', {mbid: G.fiche.mbid, titre, video_id: cur.id}); montrer(i, titre, cur.id); const p = document.querySelectorAll('.clip')[i].querySelector('.voir .btn'); if (p && !p.nextElementSibling.classList.contains('pill')) p.insertAdjacentHTML('afterend', ' <span class="pill ok">vidéo choisie</span>'); };
}
async function lireFormats() {
    const titres = [...document.querySelectorAll('.clip')].filter(el => el.querySelector('input').checked).map(el => el.dataset.t);
    if (!titres.length) return note('Coche au moins un clip.', 'warn');
    if (titres.length > 60) titres.length = 60;
    $('lireFormats').disabled = true; note('');
    const d = await post('/api/formats', {groupe: G.fiche.nom, titres, videos: V});
    if (d.error) { $('lireFormats').disabled = false; return note(d.error, 'err'); }
    $('prog').classList.add('show');
    const boucle = async () => {
        const e = await api('/api/formats/etat?job=' + d.job);
        if (e.error) { $('lireFormats').disabled = false; return note(e.error, 'err'); }
        $('progBar').style.width = (100 * e.fait / e.total) + '%'; $('progTxt').textContent = `Lecture des formats… ${e.fait} / ${e.total}`;
        Object.assign(F, e.resultats);
        document.querySelectorAll('.clip').forEach((el, i) => { const r = F[el.dataset.t]; if (r) $('fmt' + i).innerHTML = formatTxt(r); });
        if (!e.fini) return setTimeout(boucle, 2000);
        $('progTxt').textContent = `Terminé : ${e.total} clip(s) lus. Rien n’a été téléchargé.`; $('lireFormats').disabled = false;
    };
    boucle();
}
async function telechargerCoches() {
    const els = [...document.querySelectorAll('.clip')].filter(el => el.querySelector('input').checked);
    if (!els.length) return note('Coche au moins un clip.', 'warn');
    const clips = els.map(el => { const c = G.clips.find(x => x.titre === el.dataset.t); return {titre: c.titre, album: c.album, annee: c.annee, mbid: c.mbid, video_id: V[c.titre] || ''}; });
    if (!await MouConfirm(`Télécharger ${clips.length} clip(s) de ${G.fiche.nom} ?\n\nIls sont préparés sur le serveur (meilleure qualité, volume réglé). Rien n'est rangé dans « Video clip » avant ton accord, clip par clip.`, {ok: 'Télécharger', annuler: 'Annuler'})) return;
    note('Lancement…');
    const d = await post('/api/travaux', {mbid: G.fiche.mbid, clips});
    if (d.error) return note(d.error, 'err');
    note(`${(d.travaux || []).length} clip(s) mis en file : suis l'avancement en bas de page.`);
    suivreTravaux();
}
let _timerTravaux = null;
async function suivreTravaux() {
    clearTimeout(_timerTravaux);
    const d = await api('/api/travaux');
    const liste = d.travaux || [];
    $('travaux').hidden = !liste.length;
    $('travauxListe').innerHTML = (d.place_go != null ? `<div class="muted" style="margin:6px 0">Place libre sur le serveur : ${d.place_go} Go</div>` : '') + liste.map(carteTravail).join('');
    document.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => { const z = $('plan' + b.dataset.plan); z.hidden = !z.hidden; });
    document.querySelectorAll('[data-ranger]').forEach(b => b.onclick = () => ranger(b.dataset.ranger, b.dataset.nom));
    document.querySelectorAll('[data-relancer]').forEach(b => b.onclick = async () => { await post('/api/travaux/' + b.dataset.relancer + '/relancer'); suivreTravaux(); });
    document.querySelectorAll('[data-retirer]').forEach(b => b.onclick = async () => { const r = await post('/api/travaux/' + b.dataset.retirer + '/supprimer'); if (r.error) note(r.error, 'err'); suivreTravaux(); });
    if (liste.some(t => ['attente', 'telechargement', 'audio'].includes(t.etat))) _timerTravaux = setTimeout(suivreTravaux, 2500);
}
function carteTravail(t) {
    const actif = ['attente', 'telechargement', 'audio'].includes(t.etat);
    const pill = {attente: '<span class="pill">en attente</span>', telechargement: '<span class="pill warn">téléchargement</span>', audio: '<span class="pill warn">volume</span>',
                  pret: '<span class="pill ok">prêt à ranger</span>', range: '<span class="pill ok">✅ rangé</span>', erreur: '<span class="pill err">erreur</span>'}[t.etat] || '';
    const plan = (t.plan || []).map(l => `<li>${l.existe ? '⏭️ existe déjà : ' : '＋ '}${esc(l.chemin)}</li>`).join('');
    return `<div class="job"><div class="titre">${esc(t.groupe)} · ${esc(t.titre)} <span class="muted">${esc(t.album)}</span> ${pill}</div>
        ${actif ? `<div class="barre"><i style="width:${t.progres || 0}%"></i></div>` : ''}
        <div class="muted">${esc(t.message || '')}</div>
        ${t.etat === 'pret' ? `<div id="plan${t.id}" hidden><div class="muted" style="margin-top:6px">Ce qui sera créé dans « Video clip » :</div><ul>${plan}</ul></div>` : ''}
        <div class="acts">
        ${t.etat === 'pret' ? `<button class="btn small ghost" data-plan="${t.id}">📋 Voir ce qui sera créé</button><button class="btn small" data-ranger="${t.id}" data-nom="${esc(t.titre)}">📁 Ranger dans Video clip</button>` : ''}
        ${t.etat === 'erreur' ? `<button class="btn small" data-relancer="${t.id}">↻ Relancer</button>` : ''}
        ${actif ? '' : `<button class="btn small ghost" data-retirer="${t.id}">Retirer de la liste</button>`}</div></div>`;
}
async function ranger(id, nom) {
    if (!await MouConfirm(`Ranger « ${nom} » dans « Video clip » ?\n\nLe clip, son .nfo, son poster et les images du groupe qui manquent seront créés. Rien d'existant n'est remplacé.`, {ok: 'Ranger', annuler: 'Pas maintenant'})) return;
    note('Rangement…');
    const r = await post('/api/travaux/' + id + '/ranger');
    note(r.ok ? 'Rangé. ' + (r.emby || '') : (r.error || 'Rangement impossible.'), r.ok ? '' : 'err');
    suivreTravaux();
}
$('chercher').addEventListener('click', chercher);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') chercher(); });
suivreTravaux();
</script>
</body>
</html>
